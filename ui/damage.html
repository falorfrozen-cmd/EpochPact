<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EpochPact Damage</title><link rel="stylesheet" href="/ui/style.css"></head>
<body class="feed-body">
 <header class="feed-head">
  <strong>Damage</strong>
  <label title="Window opacity">Opacity <input type="range" id="damage-opacity" min="30" max="100" step="5" value="100"></label>
 </header>
 <div class="feed-options">
  <button id="damage-toggle">Start</button>
  <button id="damage-reset">Reset</button>
  <label><input type="checkbox" id="damage-compact" checked> Compact</label>
 </div>
 <p id="damage-status" class="muted">Connecting…</p>
 <main id="damage-table"><p class="empty">Waiting…</p></main>
 <script src="/ui/session.js"></script>
 <script src="/ui/damage-meter.js"></script>
 <script src="/ui/damage.js"></script>
</body>
</html>
