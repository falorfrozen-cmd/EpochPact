<!doctype html>
<html lang="en" class="overlay-page">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EpochPact Loot Feed</title><link rel="stylesheet" href="/ui/style.css"></head>
<body class="overlay-body">
 <header class="overlay-bar">
  <span class="overlay-drag pywebview-drag-region">Loot feed</span>
  <button type="button" data-overlay-options title="Window options" aria-label="Window options">⚙</button>
  <button type="button" data-overlay-hide title="Hide this window" aria-label="Hide this window">−</button>
 </header>
 <section class="overlay-options" hidden>
  <div class="overlay-filter">
   <div class="overlay-filter-head"><span>Show</span><button type="button" data-feed-all>All</button><button type="button" data-feed-none>None</button></div>
   <span class="overlay-filter-group">Items</span>
   <div class="overlay-row">
    <label class="loot-normal"><input type="checkbox" data-feed-show="normal"> Normal</label>
    <label class="loot-magic"><input type="checkbox" data-feed-show="magic"> Magic</label>
    <label class="loot-rare"><input type="checkbox" data-feed-show="rare"> Rare</label>
    <label class="loot-exalted"><input type="checkbox" data-feed-show="exalted"> Exalted</label>
    <label class="loot-unique"><input type="checkbox" data-feed-show="unique"> Unique</label>
    <label class="loot-set"><input type="checkbox" data-feed-show="set"> Set</label>
    <label class="loot-legendary"><input type="checkbox" data-feed-show="legendary"> Legendary</label>
   </div>
   <span class="overlay-filter-group">Resources</span>
   <div class="overlay-row">
    <label><input type="checkbox" data-feed-show="gold"> Gold</label>
    <label><input type="checkbox" data-feed-show="amber"> Memory Amber</label>
    <label><input type="checkbox" data-feed-show="ember"> Soul Ember</label>
    <label><input type="checkbox" data-feed-show="xp"> XP motes</label>
   </div>
   <span class="overlay-filter-group">Materials</span>
   <div class="overlay-row">
    <label><input type="checkbox" data-feed-show="shard"> Affix shards</label>
    <label><input type="checkbox" data-feed-show="rune"> Runes</label>
    <label><input type="checkbox" data-feed-show="glyph"> Glyphs</label>
    <label><input type="checkbox" data-feed-show="material"> Other materials</label>
   </div>
  </div>
  <label>Background <input type="color" data-overlay="background"></label>
  <label>Background opacity <span class="overlay-range"><input type="range" min="0" max="100" step="5" data-overlay="backgroundOpacity"><output data-overlay-value></output></span></label>
  <label>Text colour <input type="color" data-overlay="text"></label>
  <label>Text size <input type="range" min="10" max="22" step="1" data-overlay="fontSize"></label>
  <label>Row spacing <select data-overlay="spacing"><option value="compact">Compact</option><option value="normal">Normal</option><option value="roomy">Roomy</option></select></label>
  <label>Top bar <select data-overlay="bar"><option value="hover">On hover</option><option value="always">Always</option></select></label>
 </section>
 <main class="overlay-content" id="feed-list"><p class="empty">Waiting for pickups…</p></main>
 <footer class="overlay-foot"><span id="feed-gold-total"></span><span id="feed-status" class="muted">Connecting…</span></footer>
 <span class="overlay-grip" title="Resize" aria-hidden="true"></span>
 <script src="/ui/storage-sync.js"></script>
 <script src="/ui/i18n.js"></script>
 <script src="/ui/session.js"></script>
 <script src="/ui/loot-log.js"></script>
 <script src="/ui/overlay.js"></script>
 <script src="/ui/feed.js"></script>
</body>
</html>
