#ep-dps-options .game-scene{min-height:820px;position:relative;display:flex;align-items:flex-start;padding:46px 28px 125px;box-sizing:border-box;background:#24291d var(--ep-scene) center/cover no-repeat}
#ep-dps-options .game-scene:before{content:"DESIGN PREVIEW";position:absolute;left:28px;top:16px;background:#07130fbd;color:#f0dfb8;padding:4px 8px;border-left:2px solid #c3ac76;font:500 10px/1.3 Segoe UI,sans-serif;letter-spacing:.15em}
#ep-dps-options .meter{--ep-width:300px;--ep-paper:#eee9dc;--ep-dim:#b5c3b7;--ep-gold:#cbb581;--ep-jade:#88bfa2;width:min(100%,var(--ep-width));position:relative;box-sizing:border-box;font:400 13px/1.35 Segoe UI,Arial,sans-serif;color:var(--ep-paper);background:#0b1711;border:1px solid #9b88534a;box-shadow:0 5px 15px #0007}
#ep-dps-options .meter *{box-sizing:border-box}
#ep-dps-options .meter button,#ep-dps-options .meter select{font-family:inherit;color:inherit}
#ep-dps-options .meter button:focus-visible,#ep-dps-options .meter select:focus-visible{outline:2px solid #bdcfa6;outline-offset:2px}
#ep-dps-options .chrome{min-height:30px;display:flex;align-items:center;gap:5px;padding:3px 8px;border-bottom:1px solid #c2ac7930;background:#19281c}
#ep-dps-options .chrome-title{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font:400 12px/1.3 Georgia,serif;color:#d5c7a3}
#ep-dps-options .record-dot{width:4px;height:4px;border-radius:50%;background:#a1c9a5;flex:none}
#ep-dps-options .paused .record-dot{background:#cbb581}
#ep-dps-options .chrome button{min-width:23px;min-height:23px;padding:3px;border:0;background:none;color:#c3cdbb;font-size:12px}
#ep-dps-options .range-picker{min-height:22px;width:60px;border:0;background:#19281c;font-size:11px;padding:2px}
#ep-dps-options .range-picker option{background:#152319;color:#eee9dc}
#ep-dps-options .body{padding:8px 9px 9px}
#ep-dps-options .small-meta{display:flex;justify-content:space-between;gap:7px;font-size:11px;color:var(--ep-dim);margin-bottom:7px;align-items:center}
#ep-dps-options .rows{display:grid;gap:3px}

#ep-dps-options .type-token{display:flex;align-items:center;flex-direction:column;justify-content:center;gap:3px;min-width:0;padding:4px 0;border:0;background:none;text-align:center;font-size:11px}

#ep-dps-options .quiet-hud{--ep-width:264px;background:#0c1c15;border:0;border-left:2px solid #90b69b;box-shadow:0 3px 9px #0004}
#ep-dps-options .quiet-hud .chrome{background:#0c1c15;border:0;min-height:28px}
#ep-dps-options .quiet-hud .chrome .range-picker,#ep-dps-options .quiet-hud .chrome .stop,#ep-dps-options .quiet-hud .chrome .reset,#ep-dps-options .quiet-hud .chrome .collapse{visibility:hidden}
#ep-dps-options .quiet-hud:hover .chrome .range-picker,#ep-dps-options .quiet-hud:hover .chrome button,#ep-dps-options .quiet-hud:focus-within .chrome .range-picker,#ep-dps-options .quiet-hud:focus-within .chrome button{visibility:visible}
#ep-dps-options .quiet-hud .range-picker{background:#0c1c15}
#ep-dps-options .quiet-hud .body{padding-top:0}
#ep-dps-options .quiet-hud .source-summary{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:12px}
#ep-dps-options .quiet-hud .source-summary strong{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
#ep-dps-options .quiet-hud .type-strip{gap:1px}
#ep-dps-options .quiet-hud .type-token{gap:2px;padding-top:2px;padding-bottom:3px}
#ep-dps-options .ally-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;padding:5px 0;text-align:left;font-size:12px;margin-top:7px;color:var(--ep-jade)}
#ep-dps-options .ally-toggle strong{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ep-paper)}
#ep-dps-options .quiet-hud .rows{margin-top:5px}
#ep-dps-options .quiet-hud .rows[hidden]{display:none}
#ep-dps-options .quiet-hud .source-row{min-height:25px;padding-left:3px;padding-right:3px}
#ep-dps-options .quiet-hud .total{padding-top:7px;background:#0c1c15;border-top:1px solid #91b99c27}
#ep-dps-options .quiet-hud .total-number{font-size:27px}
#ep-dps-options .split-meter{--ep-width:420px}
#ep-dps-options .split-meter .body{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding-top:9px;padding-bottom:10px}
#ep-dps-options .column-head{font-size:11px;color:var(--ep-dim);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:6px}
#ep-dps-options .column-head strong{font-size:15px;font-weight:500;color:var(--ep-paper);font-variant-numeric:tabular-nums;white-space:nowrap}
#ep-dps-options .element-rows{display:grid;gap:3px}
#ep-dps-options .element-row{display:grid;grid-template-columns:15px minmax(0,1fr) auto;gap:6px;align-items:center;min-height:19px;font-size:11px}
#ep-dps-options .element-row .art{width:15px;height:15px}
#ep-dps-options .element-row .type-value{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
#ep-dps-options .split-meter .source-row{grid-template-columns:16px minmax(0,1fr) auto;min-height:25px;gap:5px;padding-left:2px;padding-right:3px}
#ep-dps-options .split-meter .source-row .art{width:16px;height:16px}
#ep-dps-options .split-meter .source-name{font-size:11px}
#ep-dps-options .split-meter .source-name small{font-size:9px;margin-left:2px}
#ep-dps-options .split-meter .source-value{font-size:12px}
#ep-dps-options .ally-inspect{border-top:1px solid #b7c6af20;margin-top:8px;padding-top:7px}
#ep-dps-options .inspect-title{font-size:10px;color:var(--ep-jade);margin-bottom:4px}
#ep-dps-options .inspect-rows{display:grid;gap:3px}
#ep-dps-options .split-meter .total{padding-top:7px;padding-bottom:9px}
#ep-dps-options .is-mini .body{display:none}
#ep-dps-options .is-mini .total{min-height:44px}
@media(max-width:540px){#ep-dps-options .game-scene{justify-content:center;padding:46px 13px 100px;background-position:56% center}#ep-dps-options .game-scene:before{left:13px}}
@media(max-width:350px){#ep-dps-options .game-scene{padding-left:10px;padding-right:10px}#ep-dps-options .type-strip{gap:1px}#ep-dps-options .type-token .type-label{font-size:9px}#ep-dps-options .split-meter .body{grid-template-columns:1fr;gap:11px}#ep-dps-options .split-meter .source-name{font-size:12px}#ep-dps-options .split-meter .source-value{font-size:13px}}
@media(pointer:coarse){#ep-dps-options .chrome button{min-width:34px;min-height:34px}#ep-dps-options .source-row{min-height:36px}#ep-dps-options .ally-toggle{min-height:40px}}
</style>
<script>
(() => {
 const root=document.getElementById('ep-dps-options');
 const types=[{name:'Physical',short:'Phys',art:13},{name:'Fire',short:'Fire',art:2},{name:'Cold',short:'Cold',art:4},{name:'Lightning',short:'Light.',art:3},{name:'Necrotic',short:'Necro',art:23},{name:'Void',short:'Void',art:22},{name:'Poison',short:'Poison',art:1}];
 const sources=[{id:'you',name:'You',count:1,art:13,values:[3210,18420,1570,2410,5860,1180,950]},{id:'skeletons',name:'Skeletons',count:4,art:11,values:[0,10480,0,0,0,0,0]},{id:'golem',name:'Golem',count:1,art:7,values:[1080,0,5240,0,0,0,0]},{id:'archers',name:'Archers',count:2,art:10,values:[2880,0,0,0,960,0,0]}];
 const sum=values=>values.reduce((a,b)=>a+b,0),n=value=>Math.round(value).toLocaleString('en-US'),k=value=>value>=1000?(value/1000).toFixed(1)+'k':n(value);
 const art=i=>`<span class="art" style="--icon-x:${i%6*20}%;--icon-y:${Math.floor(i/6)*100/3}%" aria-hidden="true"></span>`;
 const states=new Map();
 root.querySelectorAll('.meter').forEach((meter,index)=>{
  const key=['Pact Bars','Quiet HUD','Split Meter'][index],saved=window.openai?.widgetState?.compactDps?.[key]||{};
  const state={range:['10s','60s','Combat'].includes(saved.range)?saved.range:'10s',source:sources.some(s=>s.id===saved.source)?saved.source:index===2?'skeletons':'you',active:saved.active!==false,reset:!!saved.reset,mini:!!saved.mini,roster:!!saved.roster,width:index===2?420:index===1?264:300};states.set(key,state);
  const sourceRows=(list)=>`<div class="rows">${list.map(s=>`<button type="button" class="source-row cursor-interaction" data-source="${s.id}" aria-label="Inspect ${s.name} damage" aria-pressed="false" style="--source-colour:${s.id==='you'?'#cbb581':'#88bfa2'}"><span class="source-fill" aria-hidden="true"></span>${art(s.art)}<span class="source-name">${s.name}${s.id!=='you'?`<small>×${s.count}</small>`:''}</span><span class="source-value"></span></button>`).join('')}</div>`;
  const strip=`<div class="type-strip">${types.map((t,i)=>`<button type="button" class="type-token cursor-interaction" data-type="${i}" data-tooltip="${t.name}">${art(t.art)}<span class="type-label">${t.short}</span><strong class="type-value"></strong></button>`).join('')}</div>`;
  const rows=`<div class="element-rows">${types.map((t,i)=>`<div class="element-row" data-type="${i}">${art(t.art)}<span>${t.name}</span><span class="type-value"></span></div>`).join('')}</div>`;
  const content=index===0?`<div class="small-meta"><span>Damage by source</span><span>01:35</span></div>${sourceRows(sources)}<div class="element-caption"><span>Damage types · <span class="selected-name">You</span></span><button type="button" class="back-self cursor-interaction">You ↶</button></div>${strip}`:index===1?`<div class="source-summary"><span class="selected-name">You</span><strong class="selected-dps"></strong></div>${strip}<button type="button" class="ally-toggle cursor-interaction" aria-expanded="false"><span>Allies <span class="roster-arrow">⌄</span></span><strong class="allies-dps"></strong></button>${sourceRows(sources.slice(1))}`:`<div class="player-column"><div class="column-head"><span>You</span><strong class="self-dps"></strong></div>${rows}</div><div class="ally-column"><div class="column-head"><span>Allies</span><strong class="allies-dps"></strong></div>${sourceRows(sources.slice(1))}<div class="ally-inspect"><div class="inspect-title"></div><div class="inspect-rows"></div></div></div>`;
  meter.innerHTML=`<header class="chrome"><div class="chrome-title"><span class="record-dot" aria-hidden="true"></span>Damage</div><select class="range-picker cursor-interaction" aria-label="DPS averaging window"><option>10s</option><option>60s</option><option>Combat</option></select><button type="button" class="stop cursor-interaction" aria-label="Stop recording">Ⅱ</button><button type="button" class="reset cursor-interaction" aria-label="Reset sample">↺</button><button type="button" class="collapse cursor-interaction" aria-label="Minimize meter" aria-expanded="true">−</button></header><div class="body">${content}</div><footer class="total"><span class="total-label">TOTAL DPS</span><span class="total-number">54,240<small>DPS</small></span></footer>`;
  function render(){
   const factor=state.reset?0:state.range==='10s'?1:state.range==='60s'?.84:.77;
   const data=sources.map(s=>({...s,values:s.values.map(v=>v*factor)})),selected=data.find(s=>s.id===state.source),overall=sum(data.flatMap(s=>s.values)),allies=sum(data.slice(1).flatMap(s=>s.values));
   meter.style.setProperty('--ep-width',state.width+'px');meter.classList.toggle('is-mini',state.mini);meter.classList.toggle('paused',!state.active);
   meter.querySelector('.range-picker').value=state.range;meter.querySelector('.stop').textContent=state.active?'Ⅱ':'▶';meter.querySelector('.stop').setAttribute('aria-label',state.active?'Stop recording':'Resume recording');meter.querySelector('.collapse').textContent=state.mini?'+':'−';meter.querySelector('.collapse').setAttribute('aria-expanded',String(!state.mini));
   meter.querySelector('.total-number').innerHTML=n(overall)+'<small>DPS</small>';
   const largestVisibleSource=Math.max(...data.filter(s=>index===0||s.id!=='you').map(s=>sum(s.values)));
   meter.querySelectorAll('[data-source]').forEach(button=>{const source=data.find(s=>s.id===button.dataset.source);button.querySelector('.source-value').textContent=n(sum(source.values));button.setAttribute('aria-pressed',String(state.source===source.id));button.style.setProperty('--contribution',(largestVisibleSource?100*sum(source.values)/largestVisibleSource:0)+'%');});
   meter.querySelectorAll('[data-type]').forEach(row=>{const id=Number(row.dataset.type),source=index===2?data[0]:selected,value=source.values[id];row.querySelector('.type-value').textContent=index===2?n(value):k(value);row.classList.toggle('zero',value===0);row.setAttribute('aria-label',types[id].name+', '+n(value)+' DPS');row.setAttribute('data-tooltip',types[id].name+' · '+n(value)+' DPS');});
   const selectedName=meter.querySelector('.selected-name');if(selectedName)selectedName.textContent=selected.name;
   const selectedDps=meter.querySelector('.selected-dps');if(selectedDps)selectedDps.textContent=n(sum(selected.values));
   const selfDps=meter.querySelector('.self-dps');if(selfDps)selfDps.textContent=n(sum(data[0].values));
   const allyDps=meter.querySelector('.allies-dps');if(allyDps)allyDps.textContent=n(allies);
   if(index===1){meter.querySelector('.rows').hidden=!state.roster;meter.querySelector('.ally-toggle').setAttribute('aria-expanded',String(state.roster));meter.querySelector('.roster-arrow').textContent=state.roster?'⌃':'⌄';}
   if(index===2){const target=selected.id==='you'?{name:'All allies',values:types.map((_,i)=>sum(data.slice(1).map(s=>s.values[i])))}:selected;meter.querySelector('.inspect-title').textContent=target.name+' · damage types';meter.querySelector('.inspect-rows').innerHTML=types.map((t,i)=>target.values[i]>0?`<div class="element-row">${art(t.art)}<span>${t.name}</span><span class="type-value">${n(target.values[i])}</span></div>`:'').join('')||'<span class="inspect-title">No damage yet</span>';}
  }
  const save=()=>window.openai?.setWidgetState({modelContent:{compactDps:Object.fromEntries(states)},privateContent:null})?.catch(()=>{});
  render();
  meter.querySelector('.range-picker').addEventListener('change',e=>{state.range=e.target.value;render();save();});
  meter.querySelector('.stop').addEventListener('click',()=>{state.active=!state.active;render();save();});meter.querySelector('.reset').addEventListener('click',()=>{state.reset=true;render();save();});meter.querySelector('.collapse').addEventListener('click',()=>{state.mini=!state.mini;render();save();});
  meter.querySelectorAll('[data-source]').forEach(b=>b.addEventListener('click',()=>{state.source=state.source===b.dataset.source?'you':b.dataset.source;render();save();}));
  meter.querySelector('.back-self')?.addEventListener('click',()=>{state.source='you';render();save();});meter.querySelector('.ally-toggle')?.addEventListener('click',()=>{state.roster=!state.roster;render();save();});
  const handle=meter.querySelector('.chrome');let drag=null,offset={x:0,y:0};handle.addEventListener('pointerdown',e=>{if(e.target.closest('button,select'))return;const m=meter.getBoundingClientRect(),s=meter.parentElement.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y,minX:s.left-m.left+offset.x+4,maxX:s.right-m.right+offset.x-4,minY:s.top-m.top+offset.y+4,maxY:s.bottom-m.bottom+offset.y-4};handle.setPointerCapture(e.pointerId);e.preventDefault();});handle.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;offset.x=Math.max(drag.minX,Math.min(drag.maxX,drag.ox+e.clientX-drag.x));offset.y=Math.max(drag.minY,Math.min(drag.maxY,drag.oy+e.clientY-drag.y));meter.style.transform=`translate(${offset.x}px,${offset.y}px)`;});handle.addEventListener('pointerup',()=>{drag=null;});handle.addEventListener('pointercancel',()=>{drag=null;});
  meter.applyCompact=value=>{if(!value)return;state.active=value.active!==false;state.reset=!!value.reset;state.mini=!!value.mini;state.roster=!!value.roster;if(sources.some(s=>s.id===value.source))state.source=value.source;if(['10s','60s','Combat'].includes(value.range))state.range=value.range;render();};
  if(globalThis.Tweak){const t=new Tweak({container:meter,onChange:render});t.addSlider(state,'width',{label:'Window width',min:index===2?350:260,max:index===2?480:360,step:10,unit:'px'});}
 });
 window.addEventListener('openai:set_globals',e=>{const values=e.detail?.globals?.widgetState?.compactDps;if(values)root.querySelectorAll('.meter').forEach((m,i)=>m.applyCompact(values[['Pact Bars','Quiet HUD','Split Meter'][i]]));});
})();
</script>
